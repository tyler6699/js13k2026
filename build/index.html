<body onload="startGame()">
  <canvas id="c"></canvas>
  <div id="mobile-controls" aria-label="Touch controls">
    <button id="fullscreen-button" class="control-button fullscreen-button" aria-label="Toggle fullscreen">FULL</button>
    <div class="d-pad" aria-label="Direction pad">
      <button class="control-button d-up" data-key="ArrowUp" aria-label="Up">&#9650;</button>
      <button class="control-button d-left" data-key="ArrowLeft" aria-label="Move left">&#9664;</button>
      <button class="control-button d-down" data-key="ArrowDown" aria-label="Down">&#9660;</button>
      <button class="control-button d-right" data-key="ArrowRight" aria-label="Move right">&#9654;</button>
    </div>
    <button class="control-button jump-button" data-key="Space" aria-label="Jump">JUMP</button>
  </div>
  <div id="fullscreen-help" role="dialog" aria-label="Fullscreen instructions" hidden>
    <div class="fullscreen-help-panel">
      <p>For full screen on iPhone, tap Share, choose <strong>Add to Home Screen</strong>, then open the game from your Home Screen.</p>
      <button id="fullscreen-help-close">GOT IT</button>
    </div>
  </div>
